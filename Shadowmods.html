<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Shadowrocket 模块中心</title>


<style>

/* =========================================================
   Design Tokens
========================================================= */

:root {

    --background: #000000;

    --card: #1c1c1e;
    --card-hover: #232326;

    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #636366;

    --blue: #0a84ff;
    --blue-hover: #409cff;

    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;

    --radius-large: 23px;

    --content-width: 900px;

}


/* =========================================================
   Reset
========================================================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html {

    margin: 0;

    padding: 0;

    background: var(--background);

}


body {

    margin: 0;

    padding:
        max(16px, env(safe-area-inset-top))
        16px
        max(32px, env(safe-area-inset-bottom));

    background: var(--background);

    color: var(--text-primary);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;

}


button,
input {

    font: inherit;

}


a {

    color: inherit;

}


/* =========================================================
   Container
========================================================= */

.container {

    width: 100%;

    max-width: var(--content-width);

    margin: 0 auto;

}


/* =========================================================
   Header
========================================================= */

.header {

    padding:
        26px
        0
        18px;

}


.title {

    margin: 0;

    font-size: 34px;

    line-height: 1.15;

    font-weight: 700;

    letter-spacing: -1px;

}


.subtitle {

    margin-top: 8px;

    color: var(--text-secondary);

    font-size: 15px;

    line-height: 1.5;

}


/* =========================================================
   Notice
========================================================= */

.notice {

    display: flex;

    align-items: center;

    gap: 12px;

    min-height: 62px;

    margin-bottom: 14px;

    padding:
        14px
        18px;

    background: var(--card);

    border-radius: 18px;

    color: #d1d1d6;

    font-size: 15px;

    line-height: 1.5;

}


.notice-icon {

    flex: 0 0 auto;

    font-size: 24px;

    line-height: 1;

}


/* =========================================================
   Search
========================================================= */

.search-wrapper {

    position: relative;

    margin-bottom: 15px;

}


.search-icon {

    position: absolute;

    left: 18px;

    top: 50%;

    z-index: 1;

    transform: translateY(-50%);

    color: var(--text-secondary);

    font-size: 25px;

    line-height: 1;

    pointer-events: none;

}


.search {

    display: block;

    width: 100%;

    height: 60px;

    padding:
        0
        52px;

    border: 0;

    outline: none;

    border-radius: 20px;

    background: var(--card);

    color: var(--text-primary);

    font-size: 18px;

    appearance: none;

    -webkit-appearance: none;

}


.search::placeholder {

    color: var(--text-secondary);

}


.search:focus {

    background: #202023;

}


/* =========================================================
   Status
========================================================= */

.status {

    display: flex;

    align-items: center;

    justify-content: space-between;

    min-height: 22px;

    margin:
        0
        4px
        12px;

    color: var(--text-tertiary);

    font-size: 13px;

}


.status-left {

    display: flex;

    align-items: center;

    gap: 7px;

}


.status-dot {

    width: 7px;

    height: 7px;

    flex: 0 0 7px;

    border-radius: 50%;

    background: var(--green);

}


.status-dot.loading {

    background: var(--orange);

    animation:
        statusPulse 1.2s infinite;

}


.status-dot.error {

    background: var(--red);

}


@keyframes statusPulse {

    0%,
    100% {

        opacity: .35;

    }

    50% {

        opacity: 1;

    }

}


/* =========================================================
   Module List
========================================================= */

.modules {

    display: flex;

    flex-direction: column;

    gap: 14px;

}


/* =========================================================
   Module Card
========================================================= */

.module-card {

    position: relative;

    padding:
        22px
        24px
        20px;

    border-radius: var(--radius-large);

    background: var(--card);

    overflow: hidden;

    transition:
        background .18s ease,
        transform .18s ease;

}


.module-card:hover {

    background: var(--card-hover);

}


.module-card:active {

    transform: scale(.988);

}


/* =========================================================
   Card Header
========================================================= */

.card-header {

    display: flex;

    align-items: center;

    gap: 17px;

}


/* =========================================================
   Module Icon
========================================================= */

.module-icon {

    width: 76px;

    height: 76px;

    flex: 0 0 76px;

    border-radius: 20px;

    background: #2c2c2e;

    overflow: hidden;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.06);

}


.module-icon img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* =========================================================
   Card Main
========================================================= */

.card-main {

    min-width: 0;

    flex: 1;

}


.module-name {

    margin: 0;

    font-size: 24px;

    line-height: 1.25;

    font-weight: 650;

    letter-spacing: -.35px;

    word-break: break-word;

}


.module-meta {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 6px;

    color: var(--text-tertiary);

    font-size: 13px;

    line-height: 1.5;

}


.meta-separator {

    opacity: .45;

}


/* =========================================================
   Author
========================================================= */

.author {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    color: var(--text-tertiary);

    text-decoration: none;

}


.author:hover {

    color: var(--text-secondary);

}


.author-avatar {

    width: 18px;

    height: 18px;

    border-radius: 50%;

    object-fit: cover;

}


/* =========================================================
   Tags
========================================================= */

.tags {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 8px;

}


.tag {

    display: inline-flex;

    align-items: center;

    height: 22px;

    padding:
        0
        8px;

    border-radius: 11px;

    background:
        rgba(255,255,255,.055);

    color: #8e8e93;

    font-size: 11px;

    white-space: nowrap;

}


/* =========================================================
   Description
========================================================= */

.module-description {

    margin-top: 17px;

    color: var(--text-secondary);

    font-size: 16px;

    line-height: 1.6;

}


/* =========================================================
   Bottom
========================================================= */

.card-bottom {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 18px;

    margin-top: 18px;

}


.source {

    display: flex;

    align-items: center;

    gap: 8px;

    min-width: 0;

    color: var(--text-tertiary);

    font-size: 13px;

}


.source-icon {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 27px;

    height: 27px;

    flex: 0 0 27px;

    border-radius: 50%;

    background: #2c2c2e;

    color: #d1d1d6;

    font-size: 11px;

    font-weight: 700;

}


.source-text {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


/* =========================================================
   Install Button
========================================================= */

.install-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 108px;

    height: 50px;

    padding:
        0
        23px;

    border: 0;

    border-radius: 27px;

    background: var(--blue);

    color: #ffffff;

    text-decoration: none;

    font-size: 18px;

    font-weight: 600;

    white-space: nowrap;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;

}


.install-button:hover {

    background: var(--blue-hover);

}


.install-button:active {

    transform: scale(.95);

}


/* =========================================================
   Empty
========================================================= */

.empty {

    padding:
        60px
        20px;

    text-align: center;

    color: var(--text-secondary);

    font-size: 16px;

}


.empty-icon {

    margin-bottom: 12px;

    font-size: 34px;

}


.empty-error {

    margin-top: 8px;

    color: var(--text-tertiary);

    font-size: 13px;

}


/* =========================================================
   Loading
========================================================= */

.loading-card {

    height: 220px;

    border-radius: var(--radius-large);

    background:
        linear-gradient(
            90deg,
            #1c1c1e 0%,
            #252527 50%,
            #1c1c1e 100%
        );

    background-size: 200% 100%;

    animation:
        loadingAnimation 1.3s infinite;

}


@keyframes loadingAnimation {

    0% {

        background-position: 200% 0;

    }

    100% {

        background-position: -200% 0;

    }

}


/* =========================================================
   Footer
========================================================= */

.footer {

    padding:
        30px
        0
        10px;

    color: #48484a;

    text-align: center;

    font-size: 12px;

    line-height: 1.6;

}


.footer a {

    color: #636366;

    text-decoration: none;

}


/* =========================================================
   Mobile
========================================================= */

@media (max-width: 600px) {

    body {

        padding-left: 15px;

        padding-right: 15px;

    }


    .header {

        padding-top: 20px;

    }


    .title {

        font-size: 30px;

    }


    .notice {

        font-size: 14px;

    }


    .module-card {

        padding:
            20px
            20px
            18px;

        border-radius: 21px;

    }


    .module-icon {

        width: 70px;

        height: 70px;

        flex-basis: 70px;

        border-radius: 18px;

    }


    .module-name {

        font-size: 22px;

    }


    .module-description {

        margin-top: 15px;

        font-size: 15.5px;

    }


    .install-button {

        min-width: 102px;

        height: 48px;

        font-size: 17px;

    }

}


@media (max-width: 420px) {

    .card-header {

        gap: 13px;

    }


    .module-icon {

        width: 64px;

        height: 64px;

        flex-basis: 64px;

        border-radius: 17px;

    }


    .module-name {

        font-size: 20px;

    }


    .module-meta {

        font-size: 12px;

    }


    .card-bottom {

        align-items: flex-end;

    }

}

</style>

<script>

/* =========================================================
   Configuration
========================================================= */

const CONFIG = {

    README_URL:
        "https://raw.githubusercontent.com/fmz200/wool_scripts/main/README-RULE.md",

    REDIRECT_URL:
        "https://lowertop.github.io/Shadowrocket-First/redirect.html",

    GITHUB_API:
        "https://api.github.com",

    CONCURRENCY:
        5

};


/* =========================================================
   DOM
========================================================= */

const modulesContainer =
    document.getElementById("modules");

const searchInput =
    document.getElementById("search");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const countText =
    document.getElementById("countText");


let allModules = [];


/* =========================================================
   Escape HTML
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   Clean Text
========================================================= */

function cleanText(value) {

    return String(value ?? "")
        .replace(/\\n/g, " ")
        .replace(/\\r/g, "")
        .replace(/\\t/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* =========================================================
   Normalize Raw URL
========================================================= */

function normalizeRawURL(url) {

    if (!url) {

        return "";

    }


    let value =
        url
            .trim()
            .replace(/^<|>$/g, "")
            .replace(/&amp;/g, "&");


    try {

        const parsed =
            new URL(value);


        if (
            parsed.hostname ===
            "raw.githubusercontent.com"
        ) {

            return parsed.href;

        }


        if (
            parsed.hostname ===
            "github.com"
        ) {

            const parts =
                parsed.pathname
                    .split("/")
                    .filter(Boolean);


            const rawIndex =
                parts.indexOf("raw");


            if (
                parts.length >= 5 &&
                rawIndex === 2
            ) {

                const owner =
                    parts[0];

                const repo =
                    parts[1];

                const branch =
                    parts[3];

                const filePath =
                    parts
                        .slice(4)
                        .join("/");


                return (
                    "https://raw.githubusercontent.com/" +
                    `${owner}/${repo}/${branch}/${filePath}`
                );

            }

        }


        return parsed.href;

    } catch {

        return value;

    }

}


/* =========================================================
   Extract Markdown Links
========================================================= */

function extractMarkdownLinks(text) {

    const links = [];


    const regex =
        /\[([^\]]*)\]\(\s*(https?:\/\/[^)\s]+)\s*\)/g;


    let match;


    while (
        (match = regex.exec(text)) !== null
    ) {

        links.push({

            label:
                cleanText(match[1]),

            url:
                normalizeRawURL(
                    match[2]
                )

        });

    }


    return links;

}


/* =========================================================
   Find Raw URL
========================================================= */

function findModuleRawURL(cell) {

    if (!cell) {

        return "";

    }


    const links =
        extractMarkdownLinks(
            cell
        );


    for (
        const link of links
    ) {

        if (
            /raw/i.test(link.label) ||
            /sgmodule/i.test(link.url) ||
            /module/i.test(link.url)
        ) {

            return link.url;

        }

    }


    const urlMatch =
        cell.match(
            /https?:\/\/[^\s|<>]+/i
        );


    if (urlMatch) {

        return normalizeRawURL(
            urlMatch[0]
        );

    }


    return "";

}


/* =========================================================
   Parse README
========================================================= */

function parseMarkdown(markdown) {

    const lines =
        markdown.split(/\r?\n/);


    let headerIndex = -1;

    let headerColumns = [];

    let surgeIndex = -1;

    let nameIndex = -1;


    /*
     * 只识别真正的表头。
     *
     * 不能简单搜索 /surge/i，
     * 因为 Raw URL 自己就包含 /Surge/
     */

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            !line.startsWith("|")
        ) {

            continue;

        }


        const columns =
            line
                .split("|")
                .slice(1, -1)
                .map(
                    item =>
                        item.trim()
                );


        if (
            !columns.length
        ) {

            continue;

        }


        const foundSurgeIndex =
            columns.findIndex(
                column =>
                    /^(Surge|Surge\s*链接|Surge\s*模块|Surge\s*配置)$/i
                        .test(column)
            );


        const foundNameIndex =
            columns.findIndex(
                column =>
                    /^(规则名称|模块名称|配置名称|名称)$/i
                        .test(column)
            );


        if (
            foundSurgeIndex >= 0 &&
            foundNameIndex >= 0
        ) {

            headerIndex = i;

            headerColumns = columns;

            surgeIndex =
                foundSurgeIndex;

            nameIndex =
                foundNameIndex;

            break;

        }

    }


    if (
        headerIndex < 0
    ) {

        console.error(
            "README：没有找到有效表头"
        );

        return [];

    }


    console.log(
        "README 表头：",
        headerColumns
    );


    console.log(
        "Surge 列：",
        surgeIndex
    );


    console.log(
        "名称列：",
        nameIndex
    );


    const result = [];


    for (
        let i = headerIndex + 1;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            !line.startsWith("|")
        ) {

            continue;

        }


        const columns =
            line
                .split("|")
                .slice(1, -1)
                .map(
                    item =>
                        item.trim()
                );


        if (
            !columns.length
        ) {

            continue;

        }


        if (
            columns.every(
                column =>
                    /^:?-+:?$/.test(
                        column
                    )
            )
        ) {

            continue;

        }


        if (
            columns.length <=
            Math.max(
                surgeIndex,
                nameIndex
            )
        ) {

            continue;

        }


        let name =
            columns[nameIndex] || "";


        name =
            name
                .replace(
                    /\[([^\]]+)\]\([^)]+\)/g,
                    "$1"
                )
                .replace(
                    /`/g,
                    ""
                )
                .replace(
                    /<br\s*\/?>/gi,
                    " "
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        const surgeCell =
            columns[surgeIndex];


        const rawURL =
            findModuleRawURL(
                surgeCell
            );


        if (!rawURL) {

            console.warn(
                "README：没有找到 Raw 地址：",
                name,
                surgeCell
            );

            continue;

        }


        if (
            result.some(
                item =>
                    item.rawURL === rawURL
            )
        ) {

            continue;

        }


        result.push({

            name:
                name || "未命名模块",

            rawURL

        });

    }


    console.log(
        `README：共找到 ${result.length} 个模块`
    );


    return result;

}


/* =========================================================
   Parse Author
========================================================= */

function parseAuthor(value) {

    value =
        cleanText(value);


    if (!value) {

        return {

            name:
                "未知作者",

            url:
                "",

            username:
                ""

        };

    }


    const match =
        value.match(
            /^(.*?)\s*\[\s*(https?:\/\/[^\]]+)\s*\]\s*$/
        );


    if (!match) {

        const github =
            value.match(
                /^https?:\/\/github\.com\/([^/?#]+)/i
            );


        if (github) {

            return {

                name:
                    github[1],

                url:
                    value,

                username:
                    github[1]

            };

        }


        return {

            name:
                value,

            url:
                "",

            username:
                ""

        };

    }


    const name =
        match[1].trim();


    const url =
        match[2].trim();


    let username =
        "";


    const github =
        url.match(
            /github\.com\/([^/?#]+)/i
        );


    if (github) {

        username =
            github[1];

    }


    return {

        name,

        url,

        username

    };

}


/* =========================================================
   Parse Module Metadata
========================================================= */

function parseModuleMetadata(
    text,
    fallbackName
) {

    const metadata = {};


    const lines =
        text.split(/\r?\n/);


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (!line) {

            continue;

        }


        if (
            line.startsWith("#!")
        ) {

            const match =
                line.match(
                    /^#!([a-zA-Z0-9_-]+)\s*=\s*(.*)$/
                );


            if (!match) {

                continue;

            }


            const key =
                match[1]
                    .trim()
                    .toLowerCase();


            const value =
                cleanText(
                    match[2]
                );


            metadata[key] =
                value;


            continue;

        }


        if (
            line.startsWith("#")
        ) {

            continue;

        }


        break;

    }


    const tags =
        metadata.tag
            ? metadata.tag
                .split(
                    /[,，、]/
                )
                .map(
                    item =>
                        item.trim()
                )
                .filter(Boolean)
            : [];


    return {

        name:
            metadata.name ||
            fallbackName ||
            "未命名模块",

        description:
            metadata.desc ||
            "",

        author:
            parseAuthor(
                metadata.author
            ),

        icon:
            metadata.icon ||
            "",

        tags

    };

}


/* =========================================================
   Generate Description
========================================================= */

function generateDescription(
    metadata,
    rawText
) {

    /*
     * 第一优先：#!desc
     */

    if (
        metadata.description
    ) {

        return metadata.description;

    }


    /*
     * 第二优先：模块顶部普通注释
     */

    const lines =
        rawText.split(/\r?\n/);


    const comments = [];


    for (
        let i = 0;
        i < Math.min(
            lines.length,
            40
        );
        i++
    ) {

        let line =
            lines[i].trim();


        if (!line) {

            continue;

        }


        if (
            line.startsWith("#!") ||
            line.startsWith("//")
        ) {

            continue;

        }


        if (
            line.startsWith("#")
        ) {

            line =
                line
                    .replace(
                        /^#+\s*/,
                        ""
                    )
                    .trim();


            if (
                line &&
                !/^[-=*]+$/.test(line) &&
                line.length >= 4
            ) {

                comments.push(
                    line
                );

            }

        }

    }


    if (
        comments.length
    ) {

        return comments
            .slice(0, 2)
            .join(" ");

    }


    /*
     * 第三优先：根据模块内容生成通用简介
     *
     * 不使用 #!category。
     */

    return (
        `${metadata.name}，` +
        `适用于 Shadowrocket 的网络模块。`
    );

}


/* =========================================================
   Parse GitHub Raw URL
========================================================= */

function parseGitHubRawURL(
    rawURL
) {

    try {

        const url =
            new URL(rawURL);


        if (
            url.hostname !==
            "raw.githubusercontent.com"
        ) {

            return null;

        }


        const parts =
            url.pathname
                .split("/")
                .filter(Boolean);


        if (
            parts.length < 4
        ) {

            return null;

        }


        return {

            owner:
                parts[0],

            repo:
                parts[1],

            branch:
                parts[2],

            path:
                parts
                    .slice(3)
                    .join("/")

        };

    } catch {

        return null;

    }

}


/* =========================================================
   Get Raw File Last Update
========================================================= */

async function getGitHubCommitDate(
    rawURL
) {

    const info =
        parseGitHubRawURL(
            rawURL
        );


    if (!info) {

        return "";

    }


    try {

        /*
         * GitHub API 查询指定文件的 commits。
         *
         * per_page=1：
         * 返回的第一条就是这个 Raw 文件
         * 最近一次提交。
         */

        const apiURL =
            CONFIG.GITHUB_API +
            `/repos/${encodeURIComponent(info.owner)}` +
            `/${encodeURIComponent(info.repo)}` +
            `/commits` +
            `?path=${encodeURIComponent(info.path)}` +
            `&sha=${encodeURIComponent(info.branch)}` +
            `&per_page=1`;


        const response =
            await fetch(
                apiURL,
                {
                    headers: {

                        "Accept":
                            "application/vnd.github+json"

                    },

                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            console.warn(
                "GitHub API:",
                response.status,
                rawURL
            );

            return "";

        }


        const data =
            await response.json();


        if (
            !Array.isArray(data) ||
            !data.length
        ) {

            return "";

        }


        /*
         * 注意：
         *
         * 这里绝对不读取 #!date。
         *
         * 只读取 GitHub 对这个 Raw 文件
         * 对应路径的最后一次提交时间。
         */

        return (
            data[0]
                ?.commit
                ?.committer
                ?.date ||

            data[0]
                ?.commit
                ?.author
                ?.date ||

            ""
        );

    } catch (error) {

        console.warn(
            "GitHub Raw 更新时间获取失败：",
            rawURL,
            error
        );

        return "";

    }

}


/* =========================================================
   Resolve Icon
========================================================= */

function resolveIconURL(
    icon,
    rawURL
) {

    if (!icon) {

        return "";

    }


    icon =
        icon.trim();


    if (
        icon.startsWith("data:")
    ) {

        return icon;

    }


    if (
        /^https?:\/\//i.test(
            icon
        )
    ) {

        return icon;

    }


    try {

        return new URL(
            icon,
            rawURL
        ).href;

    } catch {

        return "";

    }

}


/* =========================================================
   Hash
========================================================= */

function hashString(
    value
) {

    let hash = 0;


    for (
        let i = 0;
        i < value.length;
        i++
    ) {

        hash =
            (
                (hash << 5) -
                hash +
                value.charCodeAt(i)
            ) |
            0;

    }


    return Math.abs(hash);

}


/* =========================================================
   Generate Icon
========================================================= */

function generateIcon(
    name
) {

    const hash =
        hashString(
            name
        );


    const hue1 =
        hash % 360;


    const hue2 =
        (
            hue1 +
            55 +
            (hash % 45)
        ) % 360;


    const first =
        Array.from(
            name.trim()
        )[0] ||
        "模";


    const svg = `

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 256 256"
>

<defs>

    <linearGradient
        id="gradient"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >

        <stop
            offset="0%"
            stop-color="hsl(${hue1},75%,55%)"
        />

        <stop
            offset="100%"
            stop-color="hsl(${hue2},75%,48%)"
        />

    </linearGradient>

</defs>


<rect
    width="256"
    height="256"
    rx="58"
    fill="url(#gradient)"
/>


<text
    x="128"
    y="130"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="white"
    font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"
    font-size="104"
    font-weight="700"
>
${escapeHTML(first)}
</text>


</svg>

`;


    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );

}


/* =========================================================
   Format Date
========================================================= */

function formatDate(
    value
) {

    if (!value) {

        return "更新";

    }


    let normalized =
        String(value)
            .trim();


    normalized =
        normalized.replace(
            /^(\d{4}-\d{2}-\d{2})\s+/,
            "$1T"
        );


    const date =
        new Date(
            normalized
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        )
        .padStart(2, "0");


    const day =
        String(
            date.getDate()
        )
        .padStart(2, "0");


    return (
        `${year}-${month}-${day}`
    );

}


/* =========================================================
   Create Shadowrocket Install URL
========================================================= */

function createInstallURL(
    rawURL
) {

    /*
     * Shadowrocket 原始安装协议：
     *
     * shadowrocket://install?module=Raw地址
     */

    const shadowrocketURL =
        "shadowrocket://install?module=" +
        rawURL;


    /*
     * 通过 redirect.html 中转。
     */

    return (
        CONFIG.REDIRECT_URL +
        "?url=" +
        encodeURIComponent(
            shadowrocketURL
        )
    );

}


/* =========================================================
   Repository Avatar
========================================================= */

function getRepositoryAvatar(
    rawURL
) {

    const info =
        parseGitHubRawURL(
            rawURL
        );


    if (!info) {

        return "";

    }


    return (
        `https://github.com/` +
        `${encodeURIComponent(info.owner)}` +
        `.png?size=64`
    );

}


/* =========================================================
   Fetch One Module
========================================================= */

async function fetchModule(
    item
) {

    try {

        /*
         * 读取 Raw 文件
         */

        const response =
            await fetch(
                item.rawURL,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const rawText =
            await response.text();


        /*
         * 模块元数据
         */

        const metadata =
            parseModuleMetadata(
                rawText,
                item.name
            );


        /*
         * 图标
         */

        const icon =
            resolveIconURL(
                metadata.icon,
                item.rawURL
            );


        /*
         * 重要：
         *
         * 更新时间永远来自 Raw 文件
         * 在 GitHub 上最后一次 commit。
         *
         * 不读取 #!date。
         */

        const updateDate =
            await getGitHubCommitDate(
                item.rawURL
            );


        /*
         * 简介
         */

        const description =
            generateDescription(
                metadata,
                rawText
            );


        /*
         * 作者头像
         */

        let authorAvatar = "";


        if (
            metadata.author.username
        ) {

            authorAvatar =
                `https://github.com/` +
                `${encodeURIComponent(
                    metadata.author.username
                )}` +
                `.png?size=64`;

        }


        /*
         * 如果作者不是 GitHub 用户，
         * 使用仓库 owner 头像。
         */

        if (
            !authorAvatar
        ) {

            authorAvatar =
                getRepositoryAvatar(
                    item.rawURL
                );

        }


        return {

            name:
                metadata.name,

            rawURL:
                item.rawURL,

            description,

            author:
                metadata.author,

            authorAvatar,

            icon,

            tags:
                metadata.tags,

            updateDate,

            installURL:
                createInstallURL(
                    item.rawURL
                )

        };

    } catch (error) {

        console.warn(
            "模块读取失败：",
            item.rawURL,
            error
        );


        return {

            name:
                item.name ||
                "未命名模块",

            rawURL:
                item.rawURL,

            description:
                `${item.name || "该模块"}，` +
                `适用于 Shadowrocket 的网络模块。`,

            author: {

                name:
                    "未知作者",

                url:
                    "",

                username:
                    ""

            },

            authorAvatar:
                getRepositoryAvatar(
                    item.rawURL
                ),

            icon:
                "",

            tags:
                [],

            updateDate:
                "",

            installURL:
                createInstallURL(
                    item.rawURL
                )

        };

    }

}


/* =========================================================
   Concurrent Processing
========================================================= */

async function processModules(
    items
) {

    const results =
        new Array(
            items.length
        );


    let currentIndex = 0;


    async function worker() {

        while (true) {

            const index =
                currentIndex++;


            if (
                index >= items.length
            ) {

                return;

            }


            results[index] =
                await fetchModule(
                    items[index]
                );

        }

    }


    const workerCount =
        Math.min(
            CONFIG.CONCURRENCY,
            items.length
        );


    const workers =
        Array.from(
            {
                length:
                    workerCount
            },
            () =>
                worker()
        );


    await Promise.all(
        workers
    );


    return results;

}


/* =========================================================
   Render Author
========================================================= */

function renderAuthor(
    module
) {

    const author =
        module.author;


    const avatar =
        module.authorAvatar;


    if (
        author.url
    ) {

        return `

            <a
                class="author"
                href="${escapeHTML(
                    author.url
                )}"
                target="_blank"
                rel="noopener"
            >

                ${
                    avatar
                        ? `
                            <img
                                class="author-avatar"
                                src="${escapeHTML(
                                    avatar
                                )}"
                                loading="lazy"
                                alt=""
                                onerror="
                                    this.style.display='none';
                                "
                            >
                          `
                        : ""
                }

                ${escapeHTML(
                    author.name
                )}

            </a>

        `;

    }


    return `

        <span class="author">

            ${
                avatar
                    ? `
                        <img
                            class="author-avatar"
                            src="${escapeHTML(
                                avatar
                            )}"
                            loading="lazy"
                            alt=""
                            onerror="
                                this.style.display='none';
                            "
                        >
                      `
                    : ""
            }

            ${escapeHTML(
                author.name
            )}

        </span>

    `;

}


/* =========================================================
   Create Module Card
========================================================= */

function createModuleCard(
    module
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "module-card";


    const fallbackIcon =
        generateIcon(
            module.name
        );


    const icon =
        module.icon ||
        fallbackIcon;


    const authorHTML =
        renderAuthor(
            module
        );


    const tags =
        Array.isArray(
            module.tags
        )
            ? module.tags
            : [];


    const tagsHTML =
        tags
            .slice(0, 6)
            .map(
                tag =>
                    `
                    <span class="tag">
                        ${escapeHTML(
                            tag
                        )}
                    </span>
                    `
            )
            .join("");


    const updateDate =
        formatDate(
            module.updateDate
        );


    card.innerHTML = `

        <div class="card-header">


            <div class="module-icon">

                <img
                    src="${escapeHTML(
                        icon
                    )}"
                    alt=""
                    loading="lazy"
                >

            </div>


            <div class="card-main">


                <h2 class="module-name">

                    ${escapeHTML(
                        module.name
                    )}

                </h2>


                <div class="module-meta">

                    ${authorHTML}

                    <span
                        class="meta-separator"
                    >
                        ·
                    </span>

                    <span>
                        ${escapeHTML(
                            updateDate
                        )}
                    </span>

                </div>


                ${
                    tagsHTML
                        ? `
                            <div class="tags">
                                ${tagsHTML}
                            </div>
                          `
                        : ""
                }


            </div>


        </div>


        <div class="module-description">

            ${escapeHTML(
                module.description
            )}

        </div>


        <div class="card-bottom">


            <div class="source">

                <div class="source-icon">
                    SR
                </div>

                <div class="source-text">
                    Shadowrocket 模块
                </div>

            </div>


            <a
                class="install-button"
                href="${escapeHTML(
                    module.installURL
                )}"
            >
                安装
            </a>


        </div>

    `;


    const image =
        card.querySelector(
            ".module-icon img"
        );


    if (image) {

        image.addEventListener(
            "error",
            () => {

                image.src =
                    fallbackIcon;

            },
            {
                once:
                    true
            }
        );

    }


    return card;

}


/* =========================================================
   Render Modules
========================================================= */

function renderModules(
    modules
) {

    modulesContainer.innerHTML =
        "";


    if (
        !modules.length
    ) {

        modulesContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                没有找到相关模块

            </div>

        `;


        countText.textContent =
            "0 个模块";


        return;

    }


    const fragment =
        document.createDocumentFragment();


    for (
        const module of modules
    ) {

        fragment.appendChild(
            createModuleCard(
                module
            )
        );

    }


    modulesContainer.appendChild(
        fragment
    );


    countText.textContent =
        `${modules.length} 个模块`;

}


/* =========================================================
   Search
========================================================= */

function filterModules() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    if (!keyword) {

        renderModules(
            allModules
        );

        return;

    }


    const filtered =
        allModules.filter(
            module => {

                const searchable = [

                    module.name,

                    module.description,

                    module.author?.name,

                    ...(module.tags || [])

                ]
                    .join(" ")
                    .toLowerCase();


                return searchable
                    .includes(
                        keyword
                    );

            }
        );


    renderModules(
        filtered
    );

}


searchInput.addEventListener(
    "input",
    filterModules
);


/* =========================================================
   Load Modules
========================================================= */

async function loadModules() {

    try {

        statusText.textContent =
            "正在读取模块列表...";


        statusDot.className =
            "status-dot loading";


        /*
         * README
         */

        const response =
            await fetch(
                CONFIG.README_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                `README HTTP ${response.status}`
            );

        }


        const markdown =
            await response.text();


        /*
         * README → Raw URL
         */

        const sourceModules =
            parseMarkdown(
                markdown
            );


        if (
            !sourceModules.length
        ) {

            throw new Error(
                "README 中没有找到有效的 Shadowrocket 模块"
            );

        }


        /*
         * Raw → 模块详细信息
         */

        statusText.textContent =
            `正在读取 ${sourceModules.length} 个模块，请耐心等待...`;


        allModules =
            await processModules(
                sourceModules
            );


        /*
         * 页面
         */

        renderModules(
            allModules
        );


        statusText.textContent =
            "已同步";


        statusDot.className =
            "status-dot";


    } catch (error) {

        console.error(
            "模块加载失败：",
            error
        );


        statusText.textContent =
            "同步失败";


        statusDot.className =
            "status-dot error";


        countText.textContent =
            "";


        modulesContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                无法读取模块列表

                <div class="empty-error">

                    ${escapeHTML(
                        error.message ||
                        "请检查网络连接"
                    )}

                </div>

            </div>

        `;

    }

}


/* =========================================================
   Start
========================================================= */

loadModules();

</script>
