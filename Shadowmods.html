<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>模块中心</title>

<style>

:root {
    --bg: #000000;
    --card: #1c1c1e;
    --card-hover: #232326;

    --text: #f5f5f7;
    --secondary: #8e8e93;
    --tertiary: #636366;

    --blue: #0a84ff;
    --blue-hover: #409cff;

    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;

    --radius: 24px;

    --page-width: 900px;
}


* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html {
    background: var(--bg);
}


body {
    margin: 0;

    padding:
        max(16px, env(safe-area-inset-top))
        16px
        max(30px, env(safe-area-inset-bottom));

    background: var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
}


button,
input {
    font-family: inherit;
}


.container {
    width: 100%;
    max-width: var(--page-width);

    margin: 0 auto;
}


/* =========================================================
   Header
========================================================= */

.header {
    padding: 28px 0 18px;
}


.title {
    margin: 0;

    font-size: 34px;
    line-height: 1.15;

    font-weight: 700;

    letter-spacing: -1px;
}


.subtitle {
    margin-top: 8px;

    color: var(--secondary);

    font-size: 15px;
    line-height: 1.5;
}


/* =========================================================
   Notice
========================================================= */

.notice {
    display: flex;
    align-items: center;

    gap: 12px;

    min-height: 64px;

    padding: 15px 18px;

    margin-bottom: 14px;

    background: var(--card);

    border-radius: 18px;

    color: #d1d1d6;

    font-size: 15px;
    line-height: 1.5;
}


.notice-icon {
    flex: 0 0 auto;

    font-size: 25px;
}


/* =========================================================
   Search
========================================================= */

.search-wrapper {
    position: relative;

    margin-bottom: 18px;
}


.search-icon {
    position: absolute;

    left: 18px;
    top: 50%;

    transform: translateY(-50%);

    color: var(--secondary);

    font-size: 23px;

    pointer-events: none;
}


.search {
    width: 100%;
    height: 62px;

    padding:
        0 50px;

    border: 0;
    outline: none;

    border-radius: 20px;

    background: var(--card);

    color: var(--text);

    font-size: 18px;

    appearance: none;
    -webkit-appearance: none;
}


.search::placeholder {
    color: var(--secondary);
}


.search:focus {
    background: #202023;
}


/* =========================================================
   Status
========================================================= */

.status {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin:
        0 4px
        14px;

    color: var(--secondary);

    font-size: 13px;
}


.status-left {
    display: flex;
    align-items: center;

    gap: 7px;
}


.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);
}


.status-dot.loading {
    background: var(--orange);

    animation: pulse 1.2s infinite;
}


.status-dot.error {
    background: var(--red);
}


@keyframes pulse {

    0%,
    100% {
        opacity: .35;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   Modules
========================================================= */

.modules {
    display: flex;

    flex-direction: column;

    gap: 14px;
}


/* =========================================================
   Module Card
========================================================= */

.module-card {
    position: relative;

    padding:
        26px
        26px
        22px;

    background: var(--card);

    border-radius: var(--radius);

    overflow: hidden;

    transition:
        background .18s ease,
        transform .18s ease;
}


.module-card:hover {
    background: var(--card-hover);
}


.module-card:active {
    transform: scale(.985);
}


/* =========================================================
   Header
========================================================= */

.card-header {
    display: flex;

    align-items: flex-start;

    gap: 18px;
}


/* =========================================================
   Icon
========================================================= */

.module-icon {
    width: 112px;
    height: 112px;

    flex: 0 0 112px;

    border-radius: 25px;

    overflow: hidden;

    background: #2c2c2e;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.06);
}


.module-icon img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}


.module-icon.generated {
    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 42px;
    font-weight: 700;

    letter-spacing: -2px;
}


/* =========================================================
   Main
========================================================= */

.card-main {
    min-width: 0;

    flex: 1;
}


.module-name {
    margin:
        1px
        0
        5px;

    font-size: 25px;
    line-height: 1.2;

    font-weight: 650;

    letter-spacing: -.4px;

    word-break: break-word;
}


.module-meta {
    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 6px;

    color: var(--tertiary);

    font-size: 14px;

    line-height: 1.5;
}


.meta-separator {
    opacity: .5;
}


.author {
    display: inline-flex;

    align-items: center;

    gap: 5px;

    color: var(--tertiary);

    text-decoration: none;
}


.author:hover {
    color: #8e8e93;
}


.author-avatar {
    width: 18px;
    height: 18px;

    border-radius: 50%;

    object-fit: cover;
}


/* =========================================================
   Tags
========================================================= */

.tags {
    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 10px;
}


.tag {
    display: inline-flex;

    align-items: center;

    height: 24px;

    padding:
        0 9px;

    border-radius: 12px;

    background: rgba(255,255,255,.06);

    color: #8e8e93;

    font-size: 11px;

    white-space: nowrap;
}


/* =========================================================
   Description
========================================================= */

.module-description {
    margin-top: 20px;

    color: #a1a1a6;

    font-size: 17px;

    line-height: 1.65;

    letter-spacing: .1px;
}


/* =========================================================
   Bottom
========================================================= */

.card-bottom {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-top: 22px;
}


.source {
    display: flex;

    align-items: center;

    gap: 8px;

    min-width: 0;

    color: var(--tertiary);

    font-size: 13px;
}


.source-icon {
    width: 28px;
    height: 28px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex: 0 0 28px;

    border-radius: 50%;

    background: #2c2c2e;

    font-size: 13px;

    font-weight: 600;
}


.source-text {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   Install
========================================================= */

.install-button {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 116px;
    height: 54px;

    padding:
        0 25px;

    border: 0;

    border-radius: 28px;

    background: var(--blue);

    color: white;

    text-decoration: none;

    font-size: 19px;

    font-weight: 600;

    white-space: nowrap;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}


.install-button:hover {
    background: var(--blue-hover);
}


.install-button:active {
    transform: scale(.95);
}


/* =========================================================
   Empty
========================================================= */

.empty {
    padding: 60px 20px;

    text-align: center;

    color: var(--secondary);

    font-size: 16px;
}


.empty-icon {
    margin-bottom: 12px;

    font-size: 36px;
}


/* =========================================================
   Loading
========================================================= */

.loading-card {
    height: 250px;

    border-radius: var(--radius);

    background:
        linear-gradient(
            90deg,
            #1c1c1e 0%,
            #242426 50%,
            #1c1c1e 100%
        );

    background-size: 200% 100%;

    animation:
        loading 1.3s infinite;
}


@keyframes loading {

    0% {
        background-position: 200% 0;
    }

    100% {
        background-position: -200% 0;
    }

}


/* =========================================================
   Footer
========================================================= */

.footer {
    padding:
        30px
        0
        10px;

    text-align: center;

    color: #48484a;

    font-size: 12px;

    line-height: 1.6;
}


.footer a {
    color: #636366;

    text-decoration: none;
}


/* =========================================================
   Mobile
========================================================= */

@media (max-width: 600px) {

    body {
        padding-left: 15px;
        padding-right: 15px;
    }


    .header {
        padding-top: 20px;
    }


    .title {
        font-size: 30px;
    }


    .notice {
        min-height: 62px;

        padding:
            14px 16px;

        border-radius: 18px;

        font-size: 14px;
    }


    .search {
        height: 60px;
    }


    .module-card {
        padding:
            24px
            22px
            21px;

        border-radius: 22px;
    }


    .module-icon {
        width: 92px;
        height: 92px;

        flex-basis: 92px;

        border-radius: 22px;
    }


    .module-icon.generated {
        font-size: 34px;
    }


    .module-name {
        font-size: 23px;
    }


    .module-description {
        margin-top: 18px;

        font-size: 16px;

        line-height: 1.6;
    }


    .install-button {
        min-width: 108px;

        height: 50px;

        font-size: 18px;
    }

}


@media (max-width: 420px) {

    .card-header {
        gap: 14px;
    }


    .module-icon {
        width: 78px;
        height: 78px;

        flex-basis: 78px;

        border-radius: 19px;
    }


    .module-icon.generated {
        font-size: 29px;
    }


    .module-name {
        font-size: 21px;
    }


    .module-meta {
        font-size: 12px;
    }


    .card-bottom {
        align-items: flex-end;
    }

}

</style>
</head>


<body>

<div class="container">


    <!-- =====================================================
         Header
    ====================================================== -->

    <header class="header">

        <h1 class="title">
            模块中心
        </h1>

        <div class="subtitle">
            Surge 模块 · 自动同步 · 一键安装
        </div>

    </header>


    <!-- =====================================================
         Notice
    ====================================================== -->

    <div class="notice">

        <div class="notice-icon">
            📢
        </div>

        <div>
            模块信息自动同步自
            <strong>fmz200/wool_scripts</strong>，
            无需手动维护。
        </div>

    </div>


    <!-- =====================================================
         Search
    ====================================================== -->

    <div class="search-wrapper">

        <div class="search-icon">
            ⌕
        </div>

        <input
            id="search"
            class="search"
            type="search"
            placeholder="搜索模块..."
            autocomplete="off"
            spellcheck="false"
        >

    </div>


    <!-- =====================================================
         Status
    ====================================================== -->

    <div class="status">

        <div class="status-left">

            <span
                id="statusDot"
                class="status-dot loading"
            ></span>

            <span id="statusText">
                正在同步模块...
            </span>

        </div>


        <div id="countText"></div>

    </div>


    <!-- =====================================================
         Module List
    ====================================================== -->

    <main
        id="modules"
        class="modules"
    >

        <div class="loading-card"></div>

        <div class="loading-card"></div>

    </main>


    <!-- =====================================================
         Footer
    ====================================================== -->

    <footer class="footer">

        数据来源：

        <a
            href="https://github.com/fmz200/wool_scripts"
            target="_blank"
            rel="noopener"
        >
            fmz200/wool_scripts
        </a>

        <br>

        模块信息自动同步

    </footer>


</div>


<script>

/* =========================================================
   Configuration
========================================================= */

const CONFIG = {

    /*
     * README 数据源
     */
    README_URL:
        "https://raw.githubusercontent.com/fmz200/wool_scripts/main/README-RULE.md",


    /*
     * Shadowrocket 跳转页
     */
    REDIRECT_URL:
        "https://lowertop.github.io/Shadowrocket-First/redirect.html",


    /*
     * 每次最多同时请求多少个 Module
     *
     * 防止模块很多时瞬间建立大量连接。
     */
    CONCURRENCY:
        6

};


/* =========================================================
   State
========================================================= */

let modules = [];

let allModules = [];


/* =========================================================
   DOM
========================================================= */

const modulesContainer =
    document.getElementById("modules");

const searchInput =
    document.getElementById("search");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const countText =
    document.getElementById("countText");


/* =========================================================
   Utility
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   Parse author
========================================================= */

/*
 * 示例：
 *
 * #!author=奶思[https://github.com/fmz200]
 *
 * 解析成：
 *
 * name = 奶思
 * url  = https://github.com/fmz200
 */
function parseAuthor(value) {

    if (!value) {

        return {
            name: "未知作者",
            url: "",
            username: ""
        };

    }


    const match =
        value.match(
            /^(.*?)\[(https?:\/\/[^\]]+)\]$/
        );


    if (!match) {

        return {
            name:
                value.trim(),

            url:
                "",

            username:
                ""
        };

    }


    const name =
        match[1].trim();

    const url =
        match[2].trim();


    let username = "";


    const githubMatch =
        url.match(
            /github\.com\/([^\/?#]+)/i
        );


    if (githubMatch) {
        username =
            githubMatch[1];
    }


    return {
        name,
        url,
        username
    };

}


/* =========================================================
   Parse metadata
========================================================= */

function parseModuleMetadata(text, fallbackName) {

    const metadata = {};


    /*
     * 只解析开头的 #!xxx=xxx
     */
    const lines =
        text.split(/\r?\n/);


    for (const line of lines) {

        if (!line.startsWith("#!")) {
            continue;
        }


        const match =
            line.match(
                /^#!([a-zA-Z0-9_-]+)=(.*)$/
            );


        if (!match) {
            continue;
        }


        const key =
            match[1].trim();

        const value =
            match[2].trim();


        metadata[key] =
            value;

    }


    return {

        name:
            metadata.name ||
            fallbackName ||
            "未命名模块",


        description:
            metadata.desc ||
            "",


        author:
            parseAuthor(
                metadata.author
            ),


        category:
            metadata.category ||
            "",


        icon:
            metadata.icon ||
            "",


        date:
            metadata.date ||
            "",


        homepage:
            metadata.homepage ||
            "",


        tags:
            metadata.tag
                ? metadata.tag
                    .split(",")
                    .map(tag => tag.trim())
                    .filter(Boolean)
                : [],


        rawURL:
            metadata["raw-url"] ||
            "",

    };

}


/* =========================================================
   Filename → Name fallback
========================================================= */

function getNameFromURL(url) {

    try {

        const pathname =
            new URL(url).pathname;


        let filename =
            pathname.split("/").pop();


        filename =
            decodeURIComponent(
                filename
            );


        filename =
            filename
                .replace(
                    /\.(sgmodule|module)$/i,
                    ""
                );


        return filename;

    } catch {

        return "未命名模块";

    }

}


/* =========================================================
   Generate description
========================================================= */

/*
 * 第一优先级：
 *
 * #!desc
 *
 *
 * 如果作者没有提供 desc，
 * 再根据模块自身的信息自动生成。
 */

function generateDescription(module) {

    if (
        module.description &&
        module.description.trim()
    ) {

        return module.description.trim();

    }


    const name =
        module.name;


    if (module.tags.length) {

        return `${name}，用于处理「${module.tags.join("、")}」相关请求。`;

    }


    if (module.category) {

        return `${name}，属于「${module.category}」模块，用于对相关网络请求进行处理。`;

    }


    return `${name}，适用于 Surge 的网络规则模块。`;

}


/* =========================================================
   Format date
========================================================= */

function formatDate(dateString) {

    if (!dateString) {

        return "更新时间未知";

    }


    const date =
        new Date(
            dateString.replace(" ", "T")
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return dateString;

    }


    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    return `${year}-${month}-${day}`;

}


/* =========================================================
   Generate color
========================================================= */

function hashString(value) {

    let hash = 0;


    for (
        let i = 0;
        i < value.length;
        i++
    ) {

        hash =
            (
                (hash << 5) -
                hash +
                value.charCodeAt(i)
            ) |
            0;

    }


    return Math.abs(hash);

}


/* =========================================================
   Generate SVG icon
========================================================= */

function generateIcon(name) {

    const hash =
        hashString(name);


    const hue1 =
        hash % 360;

    const hue2 =
        (hue1 + 45 + (hash % 60)) % 360;


    const first =
        name
            .trim()
            .substring(0, 1)
            .toUpperCase();


    const svg = `

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 256 256"
>

<defs>

    <linearGradient
        id="gradient"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >

        <stop
            offset="0%"
            stop-color="hsl(${hue1},75%,55%)"
        />

        <stop
            offset="100%"
            stop-color="hsl(${hue2},75%,48%)"
        />

    </linearGradient>

</defs>


<rect
    width="256"
    height="256"
    rx="58"
    fill="url(#gradient)"
/>


<circle
    cx="195"
    cy="60"
    r="48"
    fill="rgba(255,255,255,.12)"
/>


<text
    x="128"
    y="158"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="white"
    font-family="-apple-system, BlinkMacSystemFont, sans-serif"
    font-size="108"
    font-weight="700"
>
    ${escapeHTML(first)}
</text>


</svg>

`;


    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );

}


/* =========================================================
   Install URL
========================================================= */

function createInstallURL(rawURL) {

    const shadowrocketURL =
        "shadowrocket://install?module=" +
        rawURL;


    return (
        CONFIG.REDIRECT_URL +
        "?url=" +
        encodeURIComponent(
            shadowrocketURL
        )
    );

}


/* =========================================================
   Parse README
========================================================= */

function parseMarkdown(markdown) {

    const lines =
        markdown.split(/\r?\n/);


    const result = [];


    for (const line of lines) {

        const trimmed =
            line.trim();


        if (
            !trimmed.startsWith("|")
        ) {
            continue;
        }


        /*
         * 跳过表头
         */

        if (
            trimmed.includes("规则名称") ||
            trimmed.includes("Surge")
        ) {

            /*
             * 注意：
             *
             * 这里只跳过真正的表头。
             * 如果普通数据中出现 Surge，
             * 不应该被跳过。
             */

            if (
                trimmed.includes("规则名称")
            ) {

                continue;

            }

        }


        /*
         * Markdown 分割线
         */

        if (
            /^\|[\s|:\-]+\|$/.test(
                trimmed
            )
        ) {

            continue;

        }


        const columns =
            trimmed
                .split("|")
                .slice(1, -1)
                .map(
                    item =>
                        item.trim()
                );


        /*
         * 当前 README：
         *
         * 0 序号
         * 1 名称
         * 2 Loon
         * 3 Quantumult X
         * 4 Surge
         */

        if (
            columns.length < 5
        ) {

            continue;

        }


        const index =
            Number(
                columns[0]
            ) ||
            result.length + 1;


        const name =
            cleanName(
                columns[1]
            );


        const surgeColumn =
            columns[4];


        /*
         * 提取 Surge Raw
         */

        const rawMatch =
            surgeColumn.match(
                /\[Raw链接\]\((https?:\/\/[^)]+)\)/
            );


        if (!rawMatch) {

            continue;

        }


        const rawURL =
            rawMatch[1];


        /*
         * 去重
         */

        if (
            result.some(
                item =>
                    item.rawURL === rawURL
            )
        ) {

            continue;

        }


        result.push({

            index,

            readmeName:
                name,

            rawURL,

            installURL:
                createInstallURL(
                    rawURL
                )

        });

    }


    return result;

}


/* =========================================================
   Clean name
========================================================= */

function cleanName(name) {

    return String(name)
        .replace(
            /<br\s*\/?>/gi,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   Fetch module metadata
========================================================= */

async function fetchModuleMetadata(item) {

    try {

        const response =
            await fetch(
                item.rawURL,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const text =
            await response.text();


        const metadata =
            parseModuleMetadata(
                text,
                item.readmeName
            );


        /*
         * 如果 module 内有 raw-url，
         * 使用 module 自己声明的 URL。
         *
         * 否则使用 README 的 URL。
         */

        const rawURL =
            metadata.rawURL ||
            item.rawURL;


        return {

            ...item,

            ...metadata,

            rawURL,

            installURL:
                createInstallURL(
                    rawURL
                ),

            description:
                generateDescription(
                    metadata
                )

        };


    } catch (error) {

        console.warn(
            "读取模块失败：",
            item.rawURL,
            error
        );


        /*
         * 即使某个模块读取失败，
         * 也不要让整个页面失败。
         */

        const fallback = {

            name:
                item.readmeName ||
                getNameFromURL(
                    item.rawURL
                ),

            description:
                "",

            author: {
                name: "未知作者",
                url: "",
                username: ""
            },

            category: "",

            icon: "",

            date: "",

            homepage: "",

            tags: [],

            rawURL:
                item.rawURL

        };


        return {

            ...item,

            ...fallback,

            description:
                generateDescription(
                    fallback
                ),

            installURL:
                createInstallURL(
                    item.rawURL
                )

        };

    }

}


/* =========================================================
   Concurrency
========================================================= */

async function processWithConcurrency(
    items,
    concurrency
) {

    const results =
        new Array(
            items.length
        );


    let nextIndex = 0;


    async function worker() {

        while (true) {

            const index =
                nextIndex++;


            if (
                index >=
                items.length
            ) {

                return;

            }


            results[index] =
                await fetchModuleMetadata(
                    items[index]
                );

        }

    }


    const workers =
        Array.from(
            {
                length:
                    Math.min(
                        concurrency,
                        items.length
                    )
            },
            () =>
                worker()
        );


    await Promise.all(
        workers
    );


    return results;

}


/* =========================================================
   Render
========================================================= */

function renderModules(list) {

    modulesContainer.innerHTML = "";


    if (!list.length) {

        modulesContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                没有找到相关模块

            </div>

        `;


        countText.textContent =
            "0 个模块";


        return;

    }


    const fragment =
        document.createDocumentFragment();


    list.forEach(module => {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "module-card";


        /*
         * 图标
         */

        const icon =
            module.icon ||
            generateIcon(
                module.name
            );


        /*
         * 作者
         */

        let authorHTML =
            `<span class="author">
                ${escapeHTML(
                    module.author.name
                )}
            </span>`;


        if (
            module.author.url
        ) {

            const avatar =
                module.author.username
                    ? `https://github.com/${encodeURIComponent(module.author.username)}.png?size=36`
                    : "";


            authorHTML = `

                <a
                    class="author"
                    href="${escapeHTML(
                        module.author.url
                    )}"
                    target="_blank"
                    rel="noopener"
                >

                    ${
                        avatar
                            ? `
                                <img
                                    class="author-avatar"
                                    src="${escapeHTML(
                                        avatar
                                    )}"
                                    loading="lazy"
                                    alt=""
                                >
                              `
                            : ""
                    }

                    ${escapeHTML(
                        module.author.name
                    )}

                </a>

            `;

        }


        /*
         * Tags
         */

        const tagsHTML =
            module.tags
                .slice(0, 5)
                .map(
                    tag =>
                        `
                        <span class="tag">
                            ${escapeHTML(tag)}
                        </span>
                        `
                )
                .join("");


        /*
         * Icon HTML
         */

        const iconHTML =
            module.icon
                ? `
                    <img
                        src="${escapeHTML(
                            module.icon
                        )}"
                        alt=""
                        loading="lazy"
                        onerror="
                            this.onerror=null;
                            this.src='${generateIcon(module.name)}';
                        "
                    >
                  `
                : `
                    <img
                        src="${generateIcon(
                            module.name
                        )}"
                        alt=""
                    >
                  `;


        card.innerHTML = `

            <div class="card-header">

                <div class="module-icon">

                    ${iconHTML}

                </div>


                <div class="card-main">

                    <h2 class="module-name">
                        ${escapeHTML(
                            module.name
                        )}
                    </h2>


                    <div class="module-meta">

                        ${authorHTML}


                        <span class="meta-separator">
                            ·
                        </span>


                        <span>
                            ${escapeHTML(
                                formatDate(
                                    module.date
                                )
                            )}
                        </span>


                        ${
                            module.category
                                ? `
                                    <span class="meta-separator">
                                        ·
                                    </span>

                                    <span>
                                        ${escapeHTML(
                                            module.category
                                        )}
                                    </span>
                                  `
                                : ""
                        }

                    </div>


                    ${
                        tagsHTML
                            ? `
                                <div class="tags">
                                    ${tagsHTML}
                                </div>
                              `
                            : ""
                    }

                </div>

            </div>


            <div class="module-description">

                ${escapeHTML(
                    module.description
                )}

            </div>


            <div class="card-bottom">

                <div class="source">

                    <div class="source-icon">
                        S
                    </div>


                    <div class="source-text">
                        Surge Module
                    </div>

                </div>


                <a
                    class="install-button"
                    href="${escapeHTML(
                        module.installURL
                    )}"
                >
                    安装
                </a>

            </div>

        `;


        fragment.appendChild(
            card
        );

    });


    modulesContainer.appendChild(
        fragment
    );


    countText.textContent =
        `${list.length} 个模块`;

}


/* =========================================================
   Search
========================================================= */

function filterModules() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    if (!keyword) {

        renderModules(
            allModules
        );

        return;

    }


    const filtered =
        allModules.filter(
            module => {

                const searchable = [

                    module.name,

                    module.description,

                    module.author.name,

                    module.category,

                    ...module.tags

                ]
                    .join(" ")
                    .toLowerCase();


                return searchable
                    .includes(keyword);

            }
        );


    renderModules(
        filtered
    );

}


searchInput.addEventListener(
    "input",
    filterModules
);


/* =========================================================
   Load
========================================================= */

async function loadModules() {

    try {

        statusText.textContent =
            "正在读取模块列表...";

        statusDot.className =
            "status-dot loading";


        /*
         * 读取 README
         */

        const response =
            await fetch(
                CONFIG.README_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `README HTTP ${response.status}`
            );

        }


        const markdown =
            await response.text();


        /*
         * 从 README 获取 Surge Raw 地址
         */

        const baseModules =
            parseMarkdown(
                markdown
            );


        if (!baseModules.length) {

            throw new Error(
                "没有解析到 Surge 模块"
            );

        }


        statusText.textContent =
            `正在读取 ${baseModules.length} 个模块...`;


        /*
         * 并发读取每一个 .module
         */

        allModules =
            await processWithConcurrency(
                baseModules,
                CONFIG.CONCURRENCY
            );


        /*
         * 默认按照 README 顺序。
         */

        modules =
            allModules;


        renderModules(
            allModules
        );


        statusText.textContent =
            "已同步";

        statusDot.className =
            "status-dot";


    } catch (error) {

        console.error(
            "加载模块失败：",
            error
        );


        statusText.textContent =
            "同步失败";


        statusDot.className =
            "status-dot error";


        countText.textContent =
            "";


        modulesContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                无法读取模块列表

                <div style="
                    margin-top:8px;
                    color:#636366;
                    font-size:13px;
                ">
                    请检查网络连接或数据源是否可访问
                </div>

            </div>

        `;

    }

}


/* =========================================================
   Start
========================================================= */

loadModules();

</script>
