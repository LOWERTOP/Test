<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>奶思的 Shadowrocket 模块中心</title>


<style>

/* =========================================================
   基础
========================================================= */

:root {

    --bg: #000;

    --card: #1c1c1e;
    --card-hover: #232326;

    --text: #f5f5f7;
    --secondary: #8e8e93;
    --tertiary: #636366;

    --blue: #0a84ff;
    --blue-hover: #409cff;

    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;

    --radius: 23px;

    --page-width: 900px;

}


* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html {

    background: var(--bg);

}


body {

    margin: 0;

    padding:
        max(16px, env(safe-area-inset-top))
        16px
        max(30px, env(safe-area-inset-bottom));

    background: var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

}


a {

    -webkit-tap-highlight-color: transparent;

}


.container {

    width: 100%;

    max-width: var(--page-width);

    margin: 0 auto;

}


/* =========================================================
   Header
========================================================= */

.header {

    padding: 28px 0 18px;

}


.title {

    margin: 0;

    font-size: 34px;

    line-height: 1.15;

    font-weight: 700;

    letter-spacing: -1px;

}


.subtitle {

    margin-top: 8px;

    color: var(--secondary);

    font-size: 15px;

    line-height: 1.5;

}


/* =========================================================
   Notice
========================================================= */

.notice {

    display: flex;

    align-items: center;

    gap: 12px;

    min-height: 62px;

    padding: 14px 18px;

    margin-bottom: 14px;

    background: var(--card);

    border-radius: 18px;

    color: #d1d1d6;

    font-size: 15px;

    line-height: 1.5;

}


.notice-icon {

    flex: 0 0 auto;

    font-size: 24px;

}


/* =========================================================
   Search
========================================================= */

.search-wrapper {

    position: relative;

    margin-bottom: 18px;

}


.search-icon {

    position: absolute;

    left: 18px;

    top: 50%;

    transform: translateY(-50%);

    color: var(--secondary);

    font-size: 23px;

    pointer-events: none;

}


.search {

    width: 100%;

    height: 60px;

    padding: 0 50px;

    border: 0;

    outline: none;

    border-radius: 20px;

    background: var(--card);

    color: var(--text);

    font-family: inherit;

    font-size: 18px;

    appearance: none;

    -webkit-appearance: none;

}


.search::placeholder {

    color: var(--secondary);

}


.search:focus {

    background: #202023;

}


/* =========================================================
   Status
========================================================= */

.status {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin: 0 4px 14px;

    color: var(--secondary);

    font-size: 13px;

}


.status-left {

    display: flex;

    align-items: center;

    gap: 7px;

}


.status-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: var(--green);

}


.status-dot.loading {

    background: var(--orange);

    animation: pulse 1.2s infinite;

}


.status-dot.error {

    background: var(--red);

}


@keyframes pulse {

    0%,
    100% {

        opacity: .35;

    }

    50% {

        opacity: 1;

    }

}


/* =========================================================
   Modules
========================================================= */

.modules {

    display: flex;

    flex-direction: column;

    gap: 14px;

}


/* =========================================================
   Card
========================================================= */

.module-card {

    position: relative;

    padding:
        22px
        24px
        20px;

    background: var(--card);

    border-radius: var(--radius);

    overflow: hidden;

    transition:
        background .18s ease,
        transform .18s ease;

}


.module-card:hover {

    background: var(--card-hover);

}


.module-card:active {

    transform: scale(.985);

}


/* =========================================================
   Card Header
========================================================= */

.card-header {

    display: flex;

    align-items: center;

    gap: 17px;

}


/* =========================================================
   Icon
========================================================= */

.module-icon {

    width: 76px;

    height: 76px;

    flex: 0 0 76px;

    border-radius: 20px;

    overflow: hidden;

    background: #2c2c2e;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.06);

}


.module-icon img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* =========================================================
   Main
========================================================= */

.card-main {

    min-width: 0;

    flex: 1;

}


.module-name {

    margin: 0;

    font-size: 24px;

    line-height: 1.25;

    font-weight: 650;

    letter-spacing: -.35px;

    word-break: break-word;

}


.module-meta {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 6px;

    color: var(--tertiary);

    font-size: 13px;

    line-height: 1.5;

}


.meta-separator {

    opacity: .45;

}


.author {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    color: var(--tertiary);

    text-decoration: none;

}


.author:hover {

    color: #a1a1a6;

}


.author-avatar {

    width: 18px;

    height: 18px;

    border-radius: 50%;

    object-fit: cover;

}


/* =========================================================
   Tags
========================================================= */

.tags {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 8px;

}


.tag {

    display: inline-flex;

    align-items: center;

    height: 22px;

    padding: 0 8px;

    border-radius: 11px;

    background: rgba(255,255,255,.055);

    color: #8e8e93;

    font-size: 11px;

    white-space: nowrap;

}


/* =========================================================
   Description
========================================================= */

.module-description {

    margin-top: 17px;

    color: #a1a1a6;

    font-size: 16px;

    line-height: 1.6;

    letter-spacing: .05px;

}


/* =========================================================
   Bottom
========================================================= */

.card-bottom {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 18px;

    margin-top: 18px;

}


.source {

    display: flex;

    align-items: center;

    gap: 8px;

    min-width: 0;

    color: var(--tertiary);

    font-size: 13px;

}


.source-icon {

    width: 27px;

    height: 27px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex: 0 0 27px;

    border-radius: 50%;

    background: #2c2c2e;

    color: #d1d1d6;

    font-size: 12px;

    font-weight: 600;

}


.source-text {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


/* =========================================================
   Install
========================================================= */

.install-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 108px;

    height: 50px;

    padding: 0 23px;

    border: 0;

    border-radius: 27px;

    background: var(--blue);

    color: white;

    text-decoration: none;

    font-size: 18px;

    font-weight: 600;

    white-space: nowrap;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;

}


.install-button:hover {

    background: var(--blue-hover);

}


.install-button:active {

    transform: scale(.95);

}


/* =========================================================
   Empty
========================================================= */

.empty {

    padding: 60px 20px;

    text-align: center;

    color: var(--secondary);

    font-size: 16px;

}


.empty-icon {

    margin-bottom: 12px;

    font-size: 34px;

}


/* =========================================================
   Loading
========================================================= */

.loading-card {

    height: 220px;

    border-radius: var(--radius);

    background:
        linear-gradient(
            90deg,
            #1c1c1e 0%,
            #242426 50%,
            #1c1c1e 100%
        );

    background-size: 200% 100%;

    animation:
        loading 1.3s infinite;

}


@keyframes loading {

    0% {

        background-position: 200% 0;

    }

    100% {

        background-position: -200% 0;

    }

}


/* =========================================================
   Footer
========================================================= */

.footer {

    padding: 30px 0 10px;

    text-align: center;

    color: #48484a;

    font-size: 12px;

    line-height: 1.6;

}


.footer a {

    color: #636366;

    text-decoration: none;

}


/* =========================================================
   Mobile
========================================================= */

@media (max-width: 600px) {

    body {

        padding-left: 15px;

        padding-right: 15px;

    }


    .header {

        padding-top: 20px;

    }


    .title {

        font-size: 30px;

    }


    .notice {

        font-size: 14px;

    }


    .module-card {

        padding:
            20px
            20px
            18px;

        border-radius: 21px;

    }


    .module-icon {

        width: 70px;

        height: 70px;

        flex-basis: 70px;

        border-radius: 18px;

    }


    .module-name {

        font-size: 22px;

    }


    .module-description {

        margin-top: 15px;

        font-size: 15.5px;

    }


    .install-button {

        min-width: 102px;

        height: 48px;

        font-size: 17px;

    }

}


@media (max-width: 420px) {

    .card-header {

        gap: 13px;

    }


    .module-icon {

        width: 64px;

        height: 64px;

        flex-basis: 64px;

        border-radius: 17px;

    }


    .module-name {

        font-size: 20px;

    }


    .module-meta {

        font-size: 12px;

    }


    .card-bottom {

        align-items: flex-end;

    }

}

</style>

<body>


<div class="container">


<header class="header">

    <h1 class="title">
        Shadowrocket 模块
    </h1>

    <div class="subtitle">

    </div>

</header>


<div class="notice">

    <div class="notice-icon">
        📢
    </div>

    <div>
        模块信息自动同步自
        <strong>fmz200/wool_scripts</strong>
        ，无需手动维护。
    </div>

</div>


<div class="search-wrapper">

    <div class="search-icon">
        ⌕
    </div>

    <input
        id="search"
        class="search"
        type="search"

            id="statusDot"

        </span>

</div>


<main
    id="modules"
    class="modules"
>

</main>


<footer class="footer">

    数据来源：

    <a
        href="https://github.com/fmz200/wool_scripts"
        target="_blank"
        rel="noopener"
    >
        fmz200/wool_scripts
    </a>

    <br>

    Shadowrocket 模块自动同步

<script>

/* =========================================================
   Configuration
========================================================= */

const CONFIG = {

    /*
     * README
     */
    README_URL:
        "https://raw.githubusercontent.com/fmz200/wool_scripts/main/README-RULE.md",


    /*
     * Shadowrocket 安装跳转页
     */
    REDIRECT_URL:
        "https://lowertop.github.io/Shadowrocket-First/redirect.html",


    /*
     * 并发读取模块数量
     */
    CONCURRENCY:
        6,


    /*
     * GitHub API
     */
    GITHUB_API:
        "https://api.github.com"

};


/* =========================================================
   DOM
========================================================= */

const modulesContainer =
    document.getElementById("modules");

const searchInput =
    document.getElementById("search");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const countText =
    document.getElementById("countText");


let allModules = [];


/* =========================================================
   HTML Escape
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   Decode escaped metadata
========================================================= */

function decodeMetadata(value) {

    return String(value ?? "")
        .replace(/\\n/g, " ")
        .replace(/\\r/g, "")
        .replace(/\\t/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* =========================================================
   Parse author
========================================================= */

function parseAuthor(value) {

    value =
        decodeMetadata(value);


    if (!value) {

        return {

            name: "未知作者",

            url: "",

            username: ""

        };

    }


    /*
     * 支持：
     *
     * fmz200
     *
     * fmz200[https://github.com/fmz200]
     *
     * 奶思 [https://github.com/fmz200]
     */

    const match =
        value.match(
            /^(.*?)\s*\[\s*(https?:\/\/[^\]]+)\s*\]\s*$/
        );


    if (!match) {

        return {

            name: value,

            url: "",

            username: ""

        };

    }


    const name =
        match[1].trim();

    const url =
        match[2].trim();


    let username = "";


    const github =
        url.match(
            /github\.com\/([^/?#]+)/i
        );


    if (github) {

        username =
            github[1];

    }


    return {

        name,

        url,

        username

    };

}


/* =========================================================
   Parse Module Metadata
========================================================= */

function parseModuleMetadata(
    text,
    fallbackName
) {

    const metadata = {};


    /*
     * 只解析 #! 开头的元数据。
     *
     * 同时兼容：
     *
     * #!name=xxx
     *
     * #!name = xxx
     */

    const lines =
        text.split(/\r?\n/);


    for (const rawLine of lines) {

        const line =
            rawLine.trim();


        if (!line.startsWith("#!")) {

            /*
             * 元数据一般在文件最前面。
             *
             * 遇到真正的配置内容后，
             * 后面不再继续寻找。
             */

            if (
                line &&
                !line.startsWith("#")
            ) {

                break;

            }

            continue;

        }


        const match =
            line.match(
                /^#!([a-zA-Z0-9_-]+)\s*=\s*(.*)$/
            );


        if (!match) {

            continue;

        }


        const key =
            match[1]
                .trim()
                .toLowerCase();


        const value =
            decodeMetadata(
                match[2]
            );


        metadata[key] =
            value;

    }


    return {

        name:
            metadata.name ||
            fallbackName ||
            "未命名模块",


        description:
            metadata.desc ||
            "",


        author:
            parseAuthor(
                metadata.author
            ),


        icon:
            metadata.icon ||
            "",


        category:
            metadata.category ||
            "",


        date:
            metadata.date ||
            "",


        homepage:
            metadata.homepage ||
            "",


        tags:
            metadata.tag
                ? metadata.tag
                    .split(/[,\，]/)
                    .map(
                        item =>
                            item.trim()
                    )
                    .filter(Boolean)
                : []

    };

}


/* =========================================================
   Parse README Table
========================================================= */

function parseMarkdown(markdown) {

    const lines =
        markdown.split(/\r?\n/);


    let header = null;

    let surgeIndex = -1;


    const result = [];


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            !line.startsWith("|")
        ) {

            continue;

        }


        const columns =
            line
                .split("|")
                .slice(1, -1)
                .map(
                    item =>
                        item.trim()
                );


        if (!columns.length) {

            continue;

        }


        /*
         * 找真正的表头。
         *
         * 不再假定 Surge 永远是第 5 列。
         */

        if (
            columns.some(
                column =>
                    /surge/i.test(
                        column
                    )
            )
        ) {

            header =
                columns;


            surgeIndex =
                columns.findIndex(
                    column =>
                        /surge/i.test(
                            column
                        )
                );


            /*
             * 下一行通常是：
             *
             * --- | --- | ---
             *
             */

            continue;

        }


        /*
         * 还没找到 Surge 列
         */

        if (
            !header ||
            surgeIndex < 0
        ) {

            continue;

        }


        /*
         * 跳过 Markdown 分隔线
         */

        if (
            columns.every(
                column =>
                    /^:?-+:?$/.test(
                        column
                    )
            )
        ) {

            continue;

        }


        if (
            columns.length <=
            surgeIndex
        ) {

            continue;

        }


        const surge =
            columns[surgeIndex];


        /*
         * 找 Raw URL
         *
         * 支持：
         *
         * [Raw链接](...)
         *
         * [Raw](...)
         *
         * [raw](...)
         */

        const matches =
            [
                ...surge.matchAll(
                    /\[[^\]]*raw[^\]]*\]\(\s*(https?:\/\/[^)\s]+)\s*\)/ig
                )
            ];


        if (!matches.length) {

            continue;

        }


        const rawURL =
            matches[0][1];


        /*
         * 模块名称。
         *
         * 这里也不再假定名称一定是第 2 列。
         */

        let nameIndex =
            header.findIndex(
                column =>
                    /规则名称|配置名称|模块名称|名称/i.test(
                        column
                    )
            );


        /*
         * 如果找不到名称列，
         * 默认使用 Surge 前面的第一列非序号列。
         */

        if (nameIndex < 0) {

            nameIndex =
                Math.min(
                    1,
                    columns.length - 1
                );

        }


        let name =
            columns[nameIndex] ||
            "";


        name =
            name
                .replace(
                    /`/g,
                    ""
                )
                .replace(
                    /<br\s*\/?>/gi,
                    " "
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        /*
         * 去除 Markdown 链接
         */

        name =
            name.replace(
                /\[([^\]]+)\]\([^)]+\)/g,
                "$1"
            );


        /*
         * 去重
         */

        if (
            result.some(
                item =>
                    item.rawURL === rawURL
            )
        ) {

            continue;

        }


        result.push({

            name,

            rawURL

        });

    }


    return result;

}


/* =========================================================
   Install URL
========================================================= */

function createInstallURL(rawURL) {

    const shadowrocketURL =
        "shadowrocket://install?module=" +
        rawURL;


    return (
        CONFIG.REDIRECT_URL +
        "?url=" +
        encodeURIComponent(
            shadowrocketURL
        )
    );

}


/* =========================================================
   Generate Description
========================================================= */

function generateDescription(module) {

    /*
     * 第一优先：
     * Raw 中真实的 #!desc
     */

    if (
        module.description &&
        module.description.trim()
    ) {

        return module.description.trim();

    }


    /*
     * 第二优先：
     * 标签
     */

    if (
        module.tags &&
        module.tags.length
    ) {

        return (
            `${module.name}，用于处理` +
            `「${module.tags.join("、")}」相关请求。`
        );

    }


    /*
     * 第三优先：
     * 分类
     */

    if (
        module.category
    ) {

        return (
            `${module.name}，属于「` +
            `${module.category}` +
            `」模块。`
        );

    }


    /*
     * 最终 fallback
     */

    return (
        `${module.name}，` +
        `适用于 Shadowrocket 的网络模块。`
    );

}


/* =========================================================
   Format Date
========================================================= */

function formatDate(value) {

    if (!value) {

        return "更新时间未知";

    }


    const date =
        new Date(
            value.replace(
                " ",
                "T"
            )
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        )
        .padStart(2, "0");


    const day =
        String(
            date.getDate()
        )
        .padStart(2, "0");


    return (
        `${year}-${month}-${day}`
    );

}


/* =========================================================
   GitHub Raw URL → Repository Information
========================================================= */

function parseGitHubRawURL(rawURL) {

    try {

        const url =
            new URL(rawURL);


        /*
         * raw.githubusercontent.com
         *
         * /owner/repo/branch/path
         */

        if (
            url.hostname !==
            "raw.githubusercontent.com"
        ) {

            return null;

        }


        const parts =
            url.pathname
                .split("/")
                .filter(Boolean);


        if (
            parts.length < 4
        ) {

            return null;

        }


        const owner =
            parts[0];

        const repo =
            parts[1];

        const branch =
            parts[2];


        const path =
            parts
                .slice(3)
                .join("/");


        return {

            owner,

            repo,

            branch,

            path

        };

    } catch {

        return null;

    }

}


/* =========================================================
   Get GitHub Commit Date
========================================================= */

async function getGitHubCommitDate(
    rawURL
) {

    const info =
        parseGitHubRawURL(
            rawURL
        );


    if (!info) {

        return "";

    }


    try {

        const apiURL =
            `${CONFIG.GITHUB_API}` +
            `/repos/${encodeURIComponent(info.owner)}` +
            `/${encodeURIComponent(info.repo)}` +
            `/commits?path=${encodeURIComponent(info.path)}` +
            `&sha=${encodeURIComponent(info.branch)}` +
            `&per_page=1`;


        const response =
            await fetch(
                apiURL,
                {
                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        if (!response.ok) {

            return "";

        }


        const data =
            await response.json();


        if (
            !Array.isArray(data) ||
            !data.length
        ) {

            return "";

        }


        return (
            data[0]
                ?.commit
                ?.committer
                ?.date ||
            data[0]
                ?.commit
                ?.author
                ?.date ||
            ""
        );

    } catch (error) {

        console.warn(
            "GitHub 更新时间读取失败:",
            rawURL,
            error
        );

        return "";

    }

}


/* =========================================================
   Hash
========================================================= */

function hashString(value) {

    let hash = 0;


    for (
        let i = 0;
        i < value.length;
        i++
    ) {

        hash =
            (
                (hash << 5) -
                hash +
                value.charCodeAt(i)
            ) |
            0;

    }


    return Math.abs(hash);

}


/* =========================================================
   Generate Icon
========================================================= */

function generateIcon(name) {

    const hash =
        hashString(name);


    const hue1 =
        hash % 360;


    const hue2 =
        (
            hue1 +
            45 +
            hash % 60
        ) % 360;


    const first =
        name
            .trim()
            .substring(0, 1)
            .toUpperCase();


    const svg = `

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 256 256"
>

<defs>

    <linearGradient
        id="g"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >

        <stop
            offset="0%"
            stop-color="hsl(${hue1},75%,55%)"
        />

        <stop
            offset="100%"
            stop-color="hsl(${hue2},75%,48%)"
        />

    </linearGradient>

</defs>


<rect
    width="256"
    height="256"
    rx="58"
    fill="url(#g)"
/>


<text
    x="128"
    y="137"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="white"
    font-family="-apple-system,BlinkMacSystemFont,sans-serif"
    font-size="105"
    font-weight="700"
>
${escapeHTML(first)}
</text>


</svg>

`;


    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );

}


/* =========================================================
   Fetch One Module
========================================================= */

async function fetchModule(item) {

    try {

        const response =
            await fetch(
                item.rawURL,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const text =
            await response.text();


        /*
         * 从 Raw 本身读取真实元数据
         */

        const metadata =
            parseModuleMetadata(
                text,
                item.name
            );


        /*
         * 更新时间：
         *
         * 1. #!date
         * 2. GitHub commit
         */

        let updateDate =
            metadata.date;


        if (!updateDate) {

            updateDate =
                await getGitHubCommitDate(
                    item.rawURL
                );

        }


        return {

            ...item,

            ...metadata,

            updateDate,

            description:
                generateDescription(
                    metadata
                ),

            installURL:
                createInstallURL(
                    item.rawURL
                )

        };

    } catch (error) {

        console.warn(
            "模块读取失败:",
            item.rawURL,
            error
        );


        /*
         * 即使单个模块失败，
         * 页面仍然继续工作。
         */

        const fallback = {

            name:
                item.name ||
                "未命名模块",

            description:
                "",

            author: {

                name:
                    "未知作者",

                url: "",

                username: ""

            },

            icon: "",

            category: "",

            date: "",

            homepage: "",

            tags: [],

            updateDate: ""

        };


        return {

            ...item,

            ...fallback,

            description:
                generateDescription(
                    fallback
                ),

            installURL:
                createInstallURL(
                    item.rawURL
                )

        };

    }

}


/* =========================================================
   Concurrent Fetch
========================================================= */

async function processModules(
    items
) {

    const results =
        new Array(
            items.length
        );


    let index = 0;


    async function worker() {

        while (true) {

            const current =
                index++;


            if (
                current >=
                items.length
            ) {

                return;

            }


            results[current] =
                await fetchModule(
                    items[current]
                );

        }

    }


    const workers =
        Array.from(
            {
                length:
                    Math.min(
                        CONFIG.CONCURRENCY,
                        items.length
                    )
            },
            () =>
                worker()
        );


    await Promise.all(
        workers
    );


    return results;

}


/* =========================================================
   Render
========================================================= */

function renderModules(
    list
) {

    modulesContainer.innerHTML = "";


    if (!list.length) {

        modulesContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                没有找到相关模块

            </div>

        `;


        countText.textContent =
            "0 个模块";


        return;

    }


    const fragment =
        document.createDocumentFragment();


    list.forEach(
        (module) => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "module-card";


            /*
             * 图标
             */

            const fallbackIcon =
                generateIcon(
                    module.name
                );


            const icon =
                module.icon ||
                fallbackIcon;


            /*
             * 作者
             */

            let authorHTML =
                `<span class="author">
                    ${escapeHTML(
                        module.author.name
                    )}
                </span>`;


            if (
                module.author.url
            ) {

                let avatar = "";


                if (
                    module.author.username
                ) {

                    avatar =
                        `https://github.com/` +
                        `${encodeURIComponent(
                            module.author.username
                        )}.png?size=36`;

                }


                authorHTML = `

                    <a
                        class="author"
                        href="${escapeHTML(
                            module.author.url
                        )}"
                        target="_blank"
                        rel="noopener"
                    >

                        ${
                            avatar
                                ? `
                                    <img
                                        class="author-avatar"
                                        src="${escapeHTML(
                                            avatar
                                        )}"
                                        loading="lazy"
                                        alt=""
                                    >
                                  `
                                : ""
                        }

                        ${escapeHTML(
                            module.author.name
                        )}

                    </a>

                `;

            }


            /*
             * Tags
             */

            const tagsHTML =
                module.tags
                    .slice(0, 5)
                    .map(
                        tag =>
                            `
                            <span class="tag">
                                ${escapeHTML(
                                    tag
                                )}
                            </span>
                            `
                    )
                    .join("");


            /*
             * 图标
             */

            const iconHTML =
                module.icon
                    ? `
                        <img
                            src="${escapeHTML(
                                module.icon
                            )}"
                            alt=""
                            loading="lazy"
                            onerror="
                                this.onerror=null;
                                this.src='${fallbackIcon}';
                            "
                        >
                      `
                    : `
                        <img
                            src="${fallbackIcon}"
                            alt=""
                        >
                      `;


            /*
             * 更新时间
             */

            const dateText =
                formatDate(
                    module.updateDate
                );


            card.innerHTML = `

                <div class="card-header">


                    <div class="module-icon">

                        ${iconHTML}

                    </div>


                    <div class="card-main">


                        <h2 class="module-name">

                            ${escapeHTML(
                                module.name
                            )}

                        </h2>


                        <div class="module-meta">

                            ${authorHTML}


                            <span
                                class="meta-separator"
                            >
                                ·
                            </span>


                            <span>
                                ${escapeHTML(
                                    dateText
                                )}
                            </span>


                            ${
                                module.category
                                    ? `
                                        <span
                                            class="meta-separator"
                                        >
                                            ·
                                        </span>

                                        <span>
                                            ${escapeHTML(
                                                module.category
                                            )}
                                        </span>
                                      `
                                    : ""
                            }

                        </div>


                        ${
                            tagsHTML
                                ? `
                                    <div class="tags">
                                        ${tagsHTML}
                                    </div>
                                  `
                                : ""
                        }


                    </div>


                </div>


                <div class="module-description">

                    ${escapeHTML(
                        module.description
                    )}

                </div>


                <div class="card-bottom">


                    <div class="source">

                        <div class="source-icon">
                            S
                        </div>

                        <div class="source-text">
                            Shadowrocket 模块
                        </div>

                    </div>


                    <a
                        class="install-button"
                        href="${escapeHTML(
                            module.installURL
                        )}"
                    >
                        安装
                    </a>


                </div>

            `;


            fragment.appendChild(
                card
            );

        }
    );


    modulesContainer.appendChild(
        fragment
    );


    countText.textContent =
        `${list.length} 个模块`;

}


/* =========================================================
   Search
========================================================= */

function filterModules() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    if (!keyword) {

        renderModules(
            allModules
        );

        return;

    }


    const filtered =
        allModules.filter(
            module => {

                const searchable = [

                    module.name,

                    module.description,

                    module.author?.name,

                    module.category,

                    ...(module.tags || [])

                ]
                    .join(" ")
                    .toLowerCase();


                return searchable
                    .includes(
                        keyword
                    );

            }
        );


    renderModules(
        filtered
    );

}


searchInput.addEventListener(
    "input",
    filterModules
);


/* =========================================================
   Load
========================================================= */

async function loadModules() {

    try {

        statusText.textContent =
            "正在读取模块列表...";


        statusDot.className =
            "status-dot loading";


        /*
         * 读取 README
         */

        const response =
            await fetch(
                CONFIG.README_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `README HTTP ${response.status}`
            );

        }


        const markdown =
            await response.text();


        /*
         * 找到所有 Surge Raw
         */

        const sourceModules =
            parseMarkdown(
                markdown
            );


        if (
            !sourceModules.length
        ) {

            throw new Error(
                "README 中没有找到 Surge 模块"
            );

        }


        statusText.textContent =
            `正在读取 ${sourceModules.length} 个模块...`;


        /*
         * 读取每个 Raw
         */

        allModules =
            await processModules(
                sourceModules
            );


        /*
         * 默认按照 README 顺序
         */

        renderModules(
            allModules
        );


        statusText.textContent =
            "已同步";


        statusDot.className =
            "status-dot";


    } catch (error) {

        console.error(
            error
        );


        statusText.textContent =
            "同步失败";


        statusDot.className =
            "status-dot error";


        countText.textContent =
            "";


        modulesContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                无法读取模块列表

                <div style="
                    margin-top:8px;
                    color:#636366;
                    font-size:13px;
                ">
                    ${escapeHTML(
                        error.message ||
                        "请检查网络连接"
                    )}
                </div>

            </div>

        `;

    }

}


/* =========================================================
   Start
========================================================= */

loadModules();
